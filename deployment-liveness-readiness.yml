apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyfly
spec:
  selector:
    matchLabels:
      app: easyfly
  replicas: 1
  template:
    metadata:
      labels:
        app: easyfly
    spec:
      containers:
        - name: easyfly
          image: dadaramjadhav/easyfly:dev
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 150
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
---

apiVersion: v1
kind: Service
metadata: 
  name: easyfly-svc
spec:
  selector:
    app: easyfly
  ports:
    - protocol: "TCP"
      port: 8081
      targetPort: 
  type: LoadBalancer 