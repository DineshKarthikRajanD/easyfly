apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyfly
spec:
  selector:
    matchLabels:
      app: easyfly
  replicas: 3
  template:
    metadata:
      labels:
        app: easyfly
    spec:
      containers:
        - name: easyfly
          image: dadaramjadhav/easyfly:dev
          ports:
            - containerPort: 8081
---

apiVersion: v1
kind: Service
metadata: 
  name: easyfly-svc
spec:
  selector:
    app: easyfly
  ports:
    - protocol: "TCP"
      port: 8081
      targetPort: 
  type: LoadBalancer 